<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <title>Document</title>
</head>
<body>
 
 
 
    <main>
 <div class="dashboard-grid">

  <!-- Búsqueda y accesos -->
  <div class="columna-busqueda">
    <h1>¡Di hola a una nueva forma de transportarse en Popayán!</h1>
    <h2>¿A qué lugar quieres ir?</h2>

    <div class="search-group">
      <!-- Input ubicación -->
      <div class="input-box light">
        <span class="material-symbols-outlined icon">circle</span>
        <input type="text" value="Usar mi ubicación actual" readonly>
      </div>

      <!-- input destino -->
      <form class="input-destination-container">
        <div class="input-wrapper">
          <span class="material-symbols-outlined icon-yellow">location_on</span>
          <input type="text" class="input-destination" placeholder="Indica el destino">
          
        </div>
      </form>
    </div>  
    

    <!-- Accesos cerca de ti -->
    <p class="quick-access-title">Cerca de ti</p>
    
    <!-- icono bus -->
    <div class="quick-access">
      <div class="action-card card-rutas">
            <span class="material-symbols-outlined">directions_bus</span>
            <span>Rutas</span>
      </div>

    <!--icono horarios-->  
      <div class="action-card card-horarios">
            <span class="material-symbols-outlined">schedule</span>
            <span>Horarios</span>
      </div>

    <!--icono paraderos-->
      <div class="action-card card-paraderos">
            <span class="material-symbols-outlined">star</span>
            <span>Paraderos</span>
      </div>
    </div>
  </div>

  



</body>
</html>
