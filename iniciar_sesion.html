<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Holapp-Iniciar Sesión</title>
  </head>
  <body>
    <!-- Encabezado de inicio de sesión-->
    <header>

      <!-- Isotipo -->
        <img class="isotipo" src="imagenes/logo.png" alt="isotipo" />
      
    </header>

    <main>
    <div class="main-content">
      <section class="inicio-sesion">
        <h2>¡Holapp, bienvenido!</h2>
        <p class="subtitulo">Ya tienes tu usuario, por favor ingresa tus datos.</p>

        <form class="formulario-inicio">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Escribe tu correo"
            autocomplete="email"
          />

          <label for="password">Contraseña:</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Escribe tu contraseña"
            autocomplete="current-password"
          />

          <div class="recordarme">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Recordarme</label>
            

            <a href="#">Olvidé mi contraseña</a>
          </div>

          <button type="submit">Iniciar sesión</button>
          <p class="crear-cuenta">No tengo usuario <a href="#">Crear una cuenta</a></p>
        </form>
      </section>
      </div>
    </main>

  </body>
</html>
